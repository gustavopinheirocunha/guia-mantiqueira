<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<meta name="description" content="Guia interativo da viagem em família ao Hotel Fazenda Vale da Mantiqueira – Virgínia/MG, 16 a 19/11/2026.">
<title>Guia da Viagem – Vale da Mantiqueira</title>
<script>
/* Tema: 'auto' (segue o sistema), 'light' ou 'dark'. Preferência do aparelho,
   guardada separadamente dos dados da viagem (não entra no backup). */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('guiaMantiqueira.theme') || 'auto'; } catch (e) {}
  var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-pref', pref);
})();
</script>
<style>
/* =====================================================================
   1. TOKENS DE DESIGN (cores da Mantiqueira)
   ===================================================================== */
:root{
  --green-900:#1d3a2c; --green:#2f5d46; --green-600:#3d7458; --green-100:#e4efe7;
  --blue:#2c6787; --blue-100:#e1edf4;
  --earth:#8b6b4a; --earth-100:#f2e9dd;
  --cream:#f7f4ee; --white:#ffffff; --ink:#1d2823; --muted:#5d6a63; --line:#e3ddd2;
  --red:#c0262d; --red-700:#991b21; --red-100:#fde9e9;
  --amber:#a35f00; --amber-100:#fff2d9;
  --ok:#2e7d4f; --ok-100:#e3f4e9;
  /* Tokens semânticos (trocados no tema escuro) */
  --bg:var(--cream); --surface:#ffffff; --surface-2:#ece6db; --surface-3:#f0ebe2;
  --heading:#1d3a2c; --topbar:#1d3a2c; --on-accent:#ffffff;
  --input-border:#cfc8bb; --disabled:#b9b3a8;
  --blue-ink:#2c6787; --green-ink:#2f5d46; --red-ink:#991b21; --amber-ink:#6b3f00;
  --line-green:#cfe1d5; --line-blue:#cbdfeb; --line-earth:#e4d6c3; --line-amber:#f0cf8f; --line-red:#f2b9bb;
  --toast-bg:#1d2823; --toast-ink:#ffffff;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(29,40,35,.06),0 4px 14px rgba(29,40,35,.07);
  color-scheme:light;
  --nav-h:64px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display: Georgia,"Times New Roman",serif;
}
/* ---------- TEMA ESCURO: noite na serra ----------
   Aplicado via data-theme="dark" (definido pelo script do <head>,
   conforme a preferência: Automático / Claro / Escuro). */
:root[data-theme="dark"]{
  --green-900:#cfe6d6; --green:#3b7a5a; --green-600:#4f9370; --green-100:#16271e;
  --blue:#2f6f93; --blue-100:#14232d;
  --earth:#9a7a58; --earth-100:#2a2119;
  --cream:#0f1512; --ink:#e7ece8; --muted:#a3b1a9; --line:#2c3833;
  --red:#d0343b; --red-700:#ff9ea2; --red-100:#3a1416;
  --amber:#f0b45a; --amber-100:#2d220f;
  --ok:#6fcf97; --ok-100:#133022;
  --bg:#0f1512; --surface:#18211d; --surface-2:#232e29; --surface-3:#202a25;
  --heading:#d7ebdd; --topbar:#0b120f;
  --input-border:#3c4a43; --disabled:#4a544f;
  --blue-ink:#8cc6e6; --green-ink:#8fd1aa; --red-ink:#ff9ea2; --amber-ink:#f3c983;
  --line-green:#2a4535; --line-blue:#24404f; --line-earth:#4a3a29; --line-amber:#5c4519; --line-red:#6a2a2d;
  --toast-bg:#e7ece8; --toast-ink:#0f1512;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);transition:background-color .25s,color .25s;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h2{font-family:var(--font-display);font-size:1.45rem;color:var(--heading)}
h3{font-size:1.05rem}
p{margin:0 0 .6em}
a{color:var(--blue-ink)}
button,input,textarea,select{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:.86rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =====================================================================
   2. ESTRUTURA: topo, conteúdo, navegação inferior
   ===================================================================== */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar);color:#fff;padding:env(safe-area-inset-top) 0 0}
.topbar-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{font-size:1.5rem}
.brand strong{display:block;font-family:var(--font-display);font-size:1.05rem;white-space:nowrap}
.brand small{opacity:.8;font-size:.78rem;white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center}
.pill{font-size:.72rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.pill.offline{background:#a35f00}
.theme-btn{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:32px;border-radius:99px;font-size:1rem;cursor:pointer;line-height:1}
.theme-btn:active{transform:scale(.94)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--heading);box-shadow:var(--shadow)}
.save-badge{opacity:0;transition:opacity .3s}
.save-badge.show{opacity:1}

main{max-width:760px;margin:0 auto;padding:16px}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 12px}
.view-head p{margin:0}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.brand-ico{width:1.15em;height:1.15em;vertical-align:-.2em}
.bottom-nav ul{list-style:none;margin:0 auto;padding:0;max-width:760px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));height:var(--nav-h)}
.bottom-nav button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;
  font-size:.6rem;color:var(--muted);cursor:pointer;overflow:hidden;white-space:nowrap}
.bottom-nav .ico{font-size:1.2rem;line-height:1}
.bottom-nav button[aria-current="page"]{color:var(--green-ink);font-weight:700}
.bottom-nav button[aria-current="page"] .ico{transform:translateY(-1px)}
.bottom-nav .nav-sos{color:var(--red-ink);font-weight:700}

.sos-fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:45;
  width:64px;height:64px;border-radius:50%;border:3px solid var(--surface);background:var(--red);color:#fff;font-weight:800;font-size:1rem;
  box-shadow:0 6px 18px rgba(192,38,45,.45);cursor:pointer}
.sos-fab:active{transform:scale(.95)}

/* =====================================================================
   3. COMPONENTES: cards, botões, badges, formulários
   ===================================================================== */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-title h3{margin:0}
.card.tint-green{background:var(--green-100);border-color:var(--line-green)}
.card.tint-blue{background:var(--blue-100);border-color:var(--line-blue)}
.card.tint-earth{background:var(--earth-100);border-color:var(--line-earth)}
.card.danger{border:2px solid var(--red);background:var(--surface)}
.card.warn{background:var(--amber-100);border-color:var(--line-amber)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-row .btn{flex:1 1 auto}
.net-tag{font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--blue-100);color:var(--blue-ink);white-space:nowrap}
.btn.blue .net-tag,.btn.primary .net-tag,.btn.red .net-tag{background:rgba(255,255,255,.22);color:#fff}

.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.badge.inf{background:var(--blue-100);color:var(--blue-ink)}
.badge.conf{background:var(--amber-100);color:var(--amber);border:1px solid var(--line-amber)}
.badge.ok{background:var(--ok-100);color:var(--ok)}
.badge.red{background:var(--red-100);color:var(--red-ink)}

.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--input-border);border-radius:var(--radius-sm);background:var(--surface);min-height:44px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{outline:3px solid rgba(47,93,70,.25);border-color:var(--green)}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
.field .err{font-size:.8rem;color:var(--red-ink);margin-top:3px;font-weight:600}
.field.invalid input,.field.invalid textarea{border-color:var(--red);background:var(--red-100)}
.grid-2{display:grid;grid-template-columns:1fr;gap:0 12px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.list-plain{list-style:none;padding:0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:.8rem;background:var(--cream);border:1px solid var(--line);padding:4px 10px;border-radius:99px}

/* =====================================================================
   4. INÍCIO
   ===================================================================== */
.hero{border-radius:22px;padding:22px 18px 18px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#2c6787 0%,#2f5d46 55%,#1d3a2c 100%)}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:90px;
  background:radial-gradient(60% 90px at 25% 100%,rgba(255,255,255,.12),transparent 70%),radial-gradient(50% 80px at 80% 100%,rgba(255,255,255,.09),transparent 70%)}
.hero .kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font-family:var(--font-display);font-size:1.75rem;margin:.2em 0 .3em}
.hero p{margin:0 0 4px;opacity:.95}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.countdown .cd{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 4px;text-align:center}
.countdown .cd b{display:block;font-size:1.5rem;line-height:1.1}
.countdown .cd span{font-size:.7rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.countdown .cd-msg{grid-column:1/-1;background:rgba(255,255,255,.16);border-radius:12px;padding:10px;text-align:center;font-weight:600}
.stats{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stat .ico{font-size:1.5rem}
.stat small{display:block;color:var(--muted);font-size:.78rem}
.stat strong{display:block}
.btn-sos-big{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:62px;margin:0 0 14px;
  border:0;border-radius:16px;background:var(--red);color:#fff;font-size:1.1rem;font-weight:800;box-shadow:0 6px 16px rgba(192,38,45,.35);cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.quick .q{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
  text-decoration:none;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);text-align:left;font-weight:700}
.quick .q .ico{font-size:1.5rem}
.quick .q small{font-weight:500;color:var(--muted);font-size:.78rem}
.quick .q.em{background:var(--red-100);border-color:var(--line-red);color:var(--red-ink)}
.pend li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pend li:last-child{border-bottom:0}
.pend .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--amber)}
.pend .dot.ok{background:var(--ok)}
.pend .txt{flex:1}
.pend button{border:0;background:none;color:var(--blue-ink);font-weight:600;cursor:pointer;padding:4px}

/* =====================================================================
   5. ROTEIRO (linha do tempo)
   ===================================================================== */
.leg-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.leg-tabs button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:700;color:var(--muted);cursor:pointer}
.leg-tabs button[aria-selected="true"]{background:var(--surface);color:var(--heading);box-shadow:var(--shadow)}
.timeline{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.timeline::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--green),var(--blue));border-radius:3px}
.tl{display:grid;grid-template-columns:52px 1fr;gap:18px;margin-bottom:14px;position:relative}
.tl-time{font-weight:800;font-size:.86rem;color:var(--heading);text-align:right;padding-top:14px;word-break:break-word}
.tl-body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);position:relative}
.tl-body::before{content:"";position:absolute;left:-17px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--green)}
.tl.stop .tl-body{border-color:var(--line-earth);background:var(--earth-100)}
.tl.stop .tl-body::before{border-color:var(--earth)}
.tl.arrive .tl-body::before{border-color:var(--blue);background:var(--blue)}
.tl-label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tl h3{margin:2px 0 4px}
.tl .addr{font-size:.86rem;color:var(--muted)}
.note{background:var(--cream);border-left:3px solid var(--earth);padding:6px 10px;border-radius:6px;font-size:.88rem;margin-top:6px;white-space:pre-wrap}

/* =====================================================================
   6. SAÚDE E EMERGÊNCIA
   ===================================================================== */
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-weight:600}
.alert.red{background:var(--red);color:#fff}
.alert.amber{background:var(--amber-100);color:var(--amber-ink);border:1px solid var(--line-amber)}
.alert .ico{font-size:1.3rem;line-height:1.2}
.em-card{border:2px solid var(--red);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.em-card header{background:var(--red);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.em-card header h3{margin:0;font-size:1rem;letter-spacing:.04em}
.em-card .em-body{padding:12px 14px}
.em-card .missing{color:var(--amber);font-weight:600;font-style:italic}
.hosp-fact{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.hosp-fact:last-child{border-bottom:0}
.hosp-fact span:first-child{color:var(--muted)}
.hosp-fact .v{text-align:right;font-weight:600}
.check-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--cream);margin-top:10px}
.check-row input{width:22px;height:22px;accent-color:var(--green);flex:none}
.protocol{counter-reset:p;list-style:none;padding:0;margin:0}
.protocol li{counter-increment:p;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.protocol li:last-child{border-bottom:0}
.protocol li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.protocol li.crit::before{background:var(--red)}
.protocol li.crit{font-weight:700;color:var(--red-ink)}
.timer{border-radius:14px;padding:14px;background:var(--green-100);text-align:center;margin-bottom:12px}
.timer .clock{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1}
.timer .since{font-size:.85rem;color:var(--muted)}
.timer.running{background:var(--amber-100)}
.timer.alarm{background:var(--red);color:#fff;animation:pulse 1s infinite}
.timer.alarm .since{color:#fff}
.timer.alarm .call-big{background:#fff;color:#c0262d;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,38,45,.25)}}
.log li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}

/* Overlay "Estou em uma emergência" */
.sos-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sos-overlay[hidden]{display:none}
.sos-head{position:sticky;top:0;z-index:2;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.sos-head h2{color:#fff;margin:0;font-family:var(--font);font-size:1.2rem;letter-spacing:.04em}
.sos-close{border:2px solid #fff;background:transparent;color:#fff;border-radius:12px;min-height:44px;padding:6px 14px;font-weight:700;cursor:pointer}
.sos-body{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.call-big{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;text-decoration:none;margin-bottom:10px;
  background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(192,38,45,.3)}
.call-big .ico{font-size:1.8rem}
.call-big b{display:block;font-size:1.15rem}
.call-big small{display:block;opacity:.92}
.call-big.alt{background:var(--green)}
.call-big.alt2{background:var(--blue)}
.call-big[aria-disabled="true"]{background:var(--disabled);box-shadow:none;pointer-events:none}
.sos-section{margin:18px 0 8px;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* =====================================================================
   7. CONTATOS, CHECKLISTS, PROGRAMAÇÃO
   ===================================================================== */
.person{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--earth)}
.person .info{flex:1;min-width:0}
.person .info strong{display:block}
.person .info .empty{color:var(--amber);font-style:italic;font-weight:600}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-600));border-radius:99px;transition:width .3s}
.progress-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:6px 0 4px}
.checks li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--surface-3)}
.checks li:last-child{border-bottom:0}
.checks label{flex:1;display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer}
.checks input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);flex:none}
.checks .done .t{text-decoration:line-through;color:var(--muted)}
.checks .t-time{font-weight:800;color:var(--heading);font-size:.86rem;min-width:44px}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--input-border);border-radius:10px;min-height:44px;background:var(--surface)}
details.collapsible>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.collapsible>summary::-webkit-details-marker{display:none}
details.collapsible>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.collapsible[open]>summary::after{transform:rotate(180deg)}

.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.weather{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.wday .wi{font-size:1.8rem}
.wday b{display:block}
.total{display:flex;justify-content:space-between;font-weight:800;padding-top:8px;border-top:2px solid var(--line);margin-top:8px}

/* Diálogo de formulário */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,30,25,.55)}
dialog form{padding:18px}
dialog h3{font-family:var(--font-display);font-size:1.25rem;color:var(--heading)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);z-index:200;
  background:var(--toast-bg);color:var(--toast-ink);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;
  transition:all .25s;max-width:92vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--red)}
.toast.ok{background:var(--ok)}
.banner{max-width:760px;margin:10px auto 0;padding:10px 14px;border-radius:12px;font-size:.88rem;font-weight:600}
.banner.warn{background:var(--amber-100);color:var(--amber-ink);border:1px solid var(--line-amber);margin:10px 16px 0}

.print-card{display:none}

/* =====================================================================
   8. RESPONSIVIDADE (tablet / desktop)
   ===================================================================== */
@media (min-width:600px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .quick{grid-template-columns:repeat(4,1fr)}
  .grid-2{grid-template-columns:1fr 1fr}
  .weather{grid-template-columns:repeat(4,1fr)}
  .more-grid{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:2.1rem}
}
@media (min-width:1000px){
  body{font-size:17px}
}

/* =====================================================================
   9. IMPRESSÃO / PDF
   ===================================================================== */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;font-size:11pt}
  .topbar,.bottom-nav,.sos-fab,.toast,dialog,.sos-overlay,.banner,.no-print,.btn,.btn-row,.icon-btn,.add-row,.leg-tabs,.btn-sos-big,.quick,.pend button{display:none!important}
  main{max-width:none;padding:0}
  .view{display:block!important;break-before:page;animation:none}
  .view:first-of-type{break-before:auto}
  .card,.tl-body,.stat,.em-card{box-shadow:none;break-inside:avoid}
  .hero{background:#fff!important;color:var(--ink);border:2px solid var(--green)}

  .timeline .leg{display:block!important}

  .timer{display:none}

  body.print-card-mode main,body.print-card-mode header{display:none!important}
  body.print-card-mode .print-card{display:block!important}
}

/* =====================================================================

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const digits = (s) => String(s ?? '').replace(/\D/g, '');
const isBlank = (s) => !String(s ?? '').trim();
const nl2br = (s) => esc(s).replace(/\n/g, '<br>');

/** Normaliza telefone brasileiro para formato internacional (sem +) */
function normPhone(p) {
  let d = digits(p).replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
/** Link tel: — números curtos (192, 193...) ficam como estão */
function telHref(p) {
  const d = digits(p);
  if (!d) return null;
  if (d.length <= 4) return 'tel:' + d;
  return 'tel:+' + normPhone(p);
}
/** Link do WhatsApp (wa.me) — exige DDD */
function waHref(p, text) {
  const d = normPhone(p);
  if (d.length < 12) return null;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}
const mapsHref = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const dirHref = (dest, origin) => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) +
  (origin ? '&origin=' + encodeURIComponent(origin) : '') + '&travelmode=driving';

const getPath = (obj, path) => path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), obj);
function setPath(obj, path, val) {
  const ks = path.split('.');
  let a = obj;
  ks.slice(0, -1).forEach(k => { if (typeof a[k] !== 'object' || a[k] === null) a[k] = {}; a = a[k]; });
  a[ks[ks.length - 1]] = val;
}
const fmtDateTime = (iso) => { try { return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch { return iso; } };
const fmtMoney = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const ICO_WAZE = '<svg class="brand-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#33CCFF" d="M12 2.5c-4.7 0-8.5 3.4-8.5 7.7 0 1.6.5 3 1.3 4.2-.3 1.2-1 2.2-1.8 2.8 1.6.2 3-.3 4-1.1 1.1.5 2.3.8 3.6.8 4.7 0 8.5-3.4 8.5-7.7S16.7 2.5 12 2.5z"/><circle cx="8.8" cy="9.8" r="1.1" fill="#1b1b1b"/><circle cx="14.6" cy="9.8" r="1.1" fill="#1b1b1b"/><path d="M8.6 12.6c1.8 1.8 4.4 1.8 6.2 0" stroke="#1b1b1b" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="8.3" cy="19" r="1.7" fill="#1b1b1b"/><circle cx="14.7" cy="19" r="1.7" fill="#1b1b1b"/></svg>';
const ICO_GMAPS = '<svg class="brand-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z"/><path fill="#4285F4" d="M5 9a7 7 0 0 1 2.1-5L12 9z"/><path fill="#FBBC04" d="M12 9 7.1 4A7 7 0 0 1 12 2z" opacity=".0"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg>';
const wazeBtn = (query) => linkBtn({ href: wazeHref(query), label: 'Waze', cls: 'sm', net: true, newTab: true, ico: ICO_WAZE });

/* =====================================================================

const Validators = {
  text: v => v.length <= 300 || 'Máximo de 300 caracteres.',

/** Retorna mensagem de erro ou null */
function validate(value, rules) {
  for (const r of String(rules || 'text').split('|').filter(Boolean)) {
    const fn = Validators[r];
    if (!fn) continue;
    const res = fn(String(value ?? ''));
    if (res !== true) return res;
  }
  return null;
}

/** Mescla dados salvos sobre o modelo padrão (preserva campos novos) */
function mergeDefaults(def, saved) {
  if (Array.isArray(def)) return Array.isArray(saved) ? saved : def;
  if (def && typeof def === 'object') {
    const out = { ...def };
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
      for (const k of Object.keys(saved)) out[k] = k in def ? mergeDefaults(def[k], saved[k]) : saved[k];
    }
    return out;
  }
  return saved === undefined ? def : saved;
}

const Store = {
  available: (() => { try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch { return false; } })(),
  load() {
    const def = defaultState();
    if (!this.available) return def;
    try {
      const raw = localStorage.getItem(CONFIG.storageKey);
      return raw ? mergeDefaults(def, JSON.parse(raw)) : def;
    } catch (e) {
      console.error('Falha ao ler dados salvos', e);
      setTimeout(() => toast('Não foi possível ler os dados salvos. Usando dados iniciais.', 'error'), 600);
      return def;
    }
  },
  save(state) {
    if (!this.available) return false;
    try {
      state.meta.updatedAt = new Date().toISOString();
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
      return true;
    } catch (e) {
      console.error('Falha ao salvar', e);
      toast('Erro ao salvar (armazenamento cheio ou bloqueado).', 'error');
      return false;
    }
  }
};

/* =====================================================================
   4b. SINCRONIZAÇÃO ENTRE APARELHOS
   Compartilhado: roteiro, hotel, programação, hospitais, contatos,
   famílias, despesas, ficha médica, reservas e checklists (por família).
   Registro de crises e a família escolhida ficam apenas neste aparelho.
   Offline: alterações ficam marcadas como pendentes e sobem quando a
   conexão voltar. Conflito: vale a última gravação de cada seção.
   ===================================================================== */
const Sync = {
  keys: ['route', 'reservas', 'chk_f1', 'chk_f2', 'chk_f3', 'plan', 'hospitals', 'contacts', 'families', 'info', 'medical'],
  baseKey: 'guiaMantiqueira.syncBase', dirtyKey: 'guiaMantiqueira.syncDirty',
  base: {}, dirty: {}, busy: false, pendingRender: false, lastOk: null,
  enabled() { return !!(CONFIG.sync.url && CONFIG.sync.key) && Store.available; },
  init() {
    if (!this.enabled()) return;
    try {
      this.base = JSON.parse(localStorage.getItem(this.baseKey) || '{}');
      this.dirty = JSON.parse(localStorage.getItem(this.dirtyKey) || '{}');
    } catch { this.base = {}; this.dirty = {}; }
    // Campo removido não pode contar como "alteração local" (evitaria sobrescrever dados mais novos do grupo)
    try { if (this.base.medical) { const m = JSON.parse(this.base.medical); delete m.dosage; this.base.medical = JSON.stringify(m); } } catch { delete this.base.medical; }
    this.rebase(false);
    window.addEventListener('online', () => this.run());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.run(); });
    document.addEventListener('focusout', () => setTimeout(() => this.flushRender(), 300));
    setInterval(() => this.run(), 30000);
    this.run();
  },
  /** Define o estado atual como referência (sem marcar nada como pendente) */
  rebase(force) {
    // Seção nunca sincronizada neste aparelho (base indefinida) é resolvida no primeiro run():
    // se o grupo já tem dados, vale o do grupo; só sobe o local se o grupo não tiver nada.
    if (force) for (const k of this.keys) { this.base[k] = JSON.stringify(S[k]); delete this.dirty[k]; }
    this.persist();
  },
  persist() {
    try {
      localStorage.setItem(this.baseKey, JSON.stringify(this.base));
      localStorage.setItem(this.dirtyKey, JSON.stringify(this.dirty));
    } catch { /* sem armazenamento */ }
  },
  /** Chamado a cada commit: detecta seções compartilhadas alteradas */
  touch() {
    if (!this.enabled()) return;
    let any = false;
    for (const k of this.keys) if (this.base[k] !== undefined && JSON.stringify(S[k]) !== this.base[k]) { this.dirty[k] = true; any = true; }
    if (any) { this.persist(); this.runSoon(); }
  },
  async api(query, opts = {}) {
    const r = await fetch(`${CONFIG.sync.url}/rest/v1/${CONFIG.sync.table}${query}`, {
      ...opts,
      headers: { apikey: CONFIG.sync.key, Authorization: 'Bearer ' + CONFIG.sync.key, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (!r.ok) throw new Error('sync HTTP ' + r.status);
    return opts.method ? null : r.json();
  },
  async run() {
    if (!this.enabled() || this.busy || !navigator.onLine) return;
    this.busy = true;
    try {
      // 1) Baixa o que os outros alteraram (exceto seções com alteração local pendente)
      const rows = await this.api('?select=chave,valor');
      const def = defaultState();
      let changed = false;
      for (const r of rows) {
        const k = r.chave;
        if (!this.keys.includes(k) || this.dirty[k] || r.valor == null || Array.isArray(r.valor) !== Array.isArray(def[k])) continue;
        const novo = mergeDefaults(def[k], r.valor);
        if (k === 'medical') delete novo.dosage; // campo removido
        if (JSON.stringify(novo) !== JSON.stringify(S[k])) { S[k] = novo; changed = true; }
        this.base[k] = JSON.stringify(S[k]);
      }
      // Seção que o grupo ainda não tem: parte do modelo padrão; o que já existe só neste aparelho sobe
      for (const k of this.keys) if (this.base[k] === undefined) {
        this.base[k] = JSON.stringify(def[k]);
        if (JSON.stringify(S[k]) !== this.base[k]) this.dirty[k] = true;
      }
      // Garante as 3 famílias mesmo se o grupo ainda tiver a versão com 2
      if (S.families.length < 3) { S.families.push(defaultState().families[2]); this.dirty.families = true; changed = true; }
      // 2) Envia as alterações locais pendentes
      const d = this.keys.filter(k => this.dirty[k]);
      if (d.length) {
        const snap = Object.fromEntries(d.map(k => [k, JSON.stringify(S[k])]));
        const now = new Date().toISOString();
        await this.api('?on_conflict=chave', {
          method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(d.map(k => ({ chave: k, valor: S[k], atualizado_em: now })))
        });
        for (const k of d) { this.base[k] = snap[k]; if (JSON.stringify(S[k]) === snap[k]) delete this.dirty[k]; }
      }
      this.persist();
      this.lastOk = new Date().toISOString();
      if (changed) { Store.save(S); this.pendingRender = true; this.flushRender(); }
    } catch (e) {
      console.warn('Sincronização falhou (tentará de novo):', e.message);
    } finally { this.busy = false; }
  },
  /** Redesenha a tela só quando o usuário não está digitando/editando */
  flushRender() {
    if (!this.pendingRender) return;
    const a = document.activeElement;
    if ($('#formDialog')?.open || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    this.pendingRender = false;
    renderAll();
  },
  status() {
    if (!this.enabled()) return '<span class="badge conf">DESATIVADA</span>';
    const n = Object.keys(this.dirty).length;
    return (n ? `<span class="badge conf">${n} ALTERAÇÃO(ÕES) AGUARDANDO INTERNET</span>` : '<span class="badge ok">EM DIA</span>') +
      (this.lastOk ? ` · última sincronização ${esc(fmtDateTime(this.lastOk))}` : '');
  }
};
Sync.runSoon = debounce(() => Sync.run(), 800);

const Theme = {
  key: 'guiaMantiqueira.theme',
  labels: { auto: 'Automático', light: 'Claro', dark: 'Escuro' },
  icons: { auto: '🌓', light: '☀️', dark: '🌙' },
  mq: window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null,
  pref() { return document.documentElement.getAttribute('data-theme-pref') || 'auto'; },
  resolved(pref = this.pref()) { return pref === 'dark' || (pref === 'auto' && this.mq?.matches) ? 'dark' : 'light'; },
  /** Aplica o tema efetivo e atualiza a barra do navegador e os botões */
  apply(pref = this.pref()) {
    const root = document.documentElement;
    root.setAttribute('data-theme-pref', pref);
    root.setAttribute('data-theme', this.resolved(pref));
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.content = this.resolved(pref) === 'dark' ? '#0b120f' : '#2f5d46';
    const btn = $('#themeBtn');
    if (btn) { btn.textContent = this.icons[pref]; btn.setAttribute('aria-label', 'Tema: ' + this.labels[pref] + ' (toque para alternar)'); }
    $$('[data-action="theme-set"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === pref)));
  },
  set(pref) {
    if (!this.labels[pref]) return;
    try { localStorage.setItem(this.key, pref); } catch { /* sem armazenamento: vale só nesta sessão */ }
    this.apply(pref);
    toast('Tema: ' + this.labels[pref]);
  },
  cycle() { const order = ['auto', 'light', 'dark']; this.set(order[(order.indexOf(this.pref()) + 1) % 3]); }
};
// Acompanha a troca de modo do sistema quando em "Automático"
Theme.mq?.addEventListener?.('change', () => { if (Theme.pref() === 'auto') Theme.apply(); });
// Impressão/PDF sempre em tema claro (economiza tinta e garante legibilidade)
window.addEventListener('beforeprint', () => document.documentElement.setAttribute('data-theme', 'light'));
window.addEventListener('afterprint', () => Theme.apply());

const VIEWS = ['inicio', 'roteiro', 'saude', 'contatos', 'hotel', 'passeios', 'checklist', 'info'];
const NAV_PARENT = {};

function go(view, { push = true } = {}) {
  if (!VIEWS.includes(view)) view = 'inicio';
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  const navKey = NAV_PARENT[view] || view;
  $$('.bottom-nav button').forEach(b => b.toggleAttribute('aria-current', false));
  const nb = $(`.bottom-nav button[data-view="${navKey}"]`);
  if (nb) nb.setAttribute('aria-current', 'page');
  // Histórico (botão "voltar" do Android). Em visualizadores embutidos (iframe/srcdoc)
  // o navegador bloqueia pushState — nesse caso a navegação segue funcionando sem histórico.
  if (push && HISTORY_OK && location.hash !== '#' + view) {
    try { history.pushState(null, '', '#' + view); } catch { HISTORY_OK = false; }
  }
  try { window.scrollTo(0, 0); } catch { /* ignora */ }
}
/** Só usa o histórico quando a página foi aberta como arquivo/site normal */
let HISTORY_OK = (() => {
  try { return location.protocol !== 'about:' && window.self === window.top; }
  catch { return false; }
})();
window.addEventListener('popstate', () => go(location.hash.slice(1), { push: false }));

function updateCountdown() {
  const el = $('#countdown');
  if (!el) return;
  const now = new Date(), dep = new Date(CONFIG.trip.departureISO), end = new Date(CONFIG.trip.endISO);
  if (now < dep) {
    const ms = dep - now;
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    el.innerHTML = `<div class="cd"><b>${d}</b><span>dias</span></div><div class="cd"><b>${h}</b><span>horas</span></div>
      <div class="cd"><b>${m}</b><span>min</span></div><div class="cd"><b>🚗</b><span>p/ saída</span></div>`;
  } else if (now <= end) {
    const day = Math.min(4, Math.floor((now - new Date('2026-11-16T00:00:00-03:00')) / 864e5) + 1);
    el.innerHTML = `<div class="cd-msg">🌄 Viagem em andamento — dia ${day} de 4. Boa viagem!</div>`;
  } else {
    el.innerHTML = `<div class="cd-msg">🏡 Viagem concluída. Esperamos que tenha sido inesquecível!</div>`;
  }
}

/* ---------- Cronômetro de crise ---------- */
let seizureInterval = null;
function seizureStart() {
  if (S.seizure.running) return;
  S.seizure = { running: true, start: new Date().toISOString() };
  commit();
  toast('Cronômetro iniciado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
  startSeizureTick();
}
function seizureStop() {
  if (!S.seizure.running) return toast('O cronômetro não está em andamento.');
  const secs = Math.round((Date.now() - new Date(S.seizure.start)) / 1000);
  S.seizureLog.push({ start: S.seizure.start, end: new Date().toISOString(), duration: fmtClock(secs) });
  S.seizure = { running: false, start: null };
  commit('Crise registrada: ' + fmtClock(secs));
  clearInterval(seizureInterval); seizureInterval = null;
  renderSaude(); updateSeizureUI();
}
const fmtClock = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function startSeizureTick() {
  clearInterval(seizureInterval);
  seizureInterval = setInterval(updateSeizureUI, 500);
  updateSeizureUI();
}
let alarmed = false;
function updateSeizureUI() {
  const run = S.seizure.running;
  const secs = run ? Math.max(0, Math.round((Date.now() - new Date(S.seizure.start)) / 1000)) : 0;
  const alarm = run && secs >= 300;
  if (alarm && !alarmed) { alarmed = true; try { navigator.vibrate?.([400, 200, 400, 200, 400]); } catch {} }
  if (!run) alarmed = false;
  $$('[data-seizure="box"]').forEach(box => {
    box.classList.toggle('running', run && !alarm);
    box.classList.toggle('alarm', alarm);
    $('[data-seizure="clock"]', box).textContent = fmtClock(secs);
    $('[data-seizure="since"]', box).textContent = run ? 'Início: ' + new Date(S.seizure.start).toLocaleTimeString('pt-BR') : 'Cronômetro de crise';
    $('[data-seizure="msg"]', box).innerHTML = alarm
      ? '<b>5 MINUTOS OU MAIS — LIGUE PARA O SAMU 192</b>'
      : run ? 'Mantenha a criança de lado e protegida. Aos 5 min, acione o SAMU.' : 'Toque em iniciar quando a crise começar.';
    $('[data-seizure="startBtn"]', box).disabled = run;
    $('[data-seizure="stopBtn"]', box).disabled = !run;
    let callLink = $('[data-seizure="call"]', box);
    if (alarm && !callLink) {
      box.insertAdjacentHTML('beforeend', `<a class="call-big" data-seizure="call" href="tel:192" style="margin-top:10px"><span class="ico">🚑</span><span><b>Ligar SAMU 192</b></span></a>`);
    } else if (!alarm && callLink) callLink.remove();
  });
}

  return `<div class="weather">${W.days.map(d => {

    const dt = new Date(d.date + 'T12:00:00-03:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });

  }).join('')}</div><p class="small muted" style="margin-top:6px">Atualizado em ${esc(fmtDateTime(W.fetchedAt))} · fonte: Open-Meteo · ${esc(CONFIG.weather.label)}. Previsões mudam — atualize perto da data.</p>`;

async function fetchWeather() {
  if (!navigator.onLine) return toast('Sem conexão. A previsão do tempo precisa de internet.', 'error');
  const { lat, lon } = CONFIG.weather, d = CONFIG.trip.days;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&start_date=${d[0]}&end_date=${d[d.length - 1]}`;
  const box = $('#weatherBox');
  if (box) box.innerHTML = '<p class="small muted">Carregando previsão…</p>';
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
    const res = await fetch(url, { signal: ctrl.signal }); clearTimeout(t);
    const j = await res.json();
    if (!res.ok || j.error) throw new Error(j.reason || 'HTTP ' + res.status);
    const D = j.daily;
    S.weather = { fetchedAt: new Date().toISOString(), days: D.time.map((date, i) => ({ date, code: D.weather_code[i], max: D.temperature_2m_max[i], min: D.temperature_2m_min[i], rain: D.precipitation_probability_max?.[i] ?? null })) };
    commit('Previsão atualizada');
  } catch (e) {
    console.error(e);
    toast(/range|date/i.test(String(e.message)) ? 'Previsão ainda indisponível para essas datas. Tente mais perto da viagem.' : 'Não foi possível obter a previsão agora.', 'error');
  }
  if (box) box.innerHTML = weatherHtml();
}

async function shareText(title, text) {
  try {
    if (navigator.share) { await navigator.share({ title, text }); return toast('Compartilhado', 'ok'); }
  } catch (e) { if (e.name === 'AbortError') return; console.warn(e); }
  try { await navigator.clipboard.writeText(text); toast('Texto copiado. Cole no WhatsApp ou onde preferir.', 'ok'); }
  catch {
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    toast('Abrindo o WhatsApp para compartilhar (requer internet).');
  }
}

/* ---------- Exportar / importar ---------- */
function exportBackup() {
  try {
    const payload = { app: CONFIG.appId, schemaVersion: CONFIG.schemaVersion, exportedAt: new Date().toISOString(), data: S };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'guia-viagem-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup exportado', 'ok');
  } catch (e) { console.error(e); toast('Não foi possível exportar o backup.', 'error'); }
}
function importBackup(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast('Arquivo grande demais para ser um backup deste guia.', 'error');
  const reader = new FileReader();
  reader.onerror = () => toast('Erro ao ler o arquivo.', 'error');
  reader.onload = () => {
    try {
      const j = JSON.parse(reader.result);
      if (j.app !== CONFIG.appId || typeof j.data !== 'object' || !j.data) throw new Error('formato');
      if (!confirm('Importar este backup substituirá os dados atuais deste aparelho. Continuar?')) return;
      S = mergeDefaults(defaultState(), j.data);
      if (!Array.isArray(S.contacts) || !Array.isArray(S.chk_f1?.lists) || !S.route?.ida) throw new Error('estrutura');
      commit('Backup importado com sucesso', 'ok');
      renderAll();
    } catch (e) {
      console.warn('Backup rejeitado:', e.message);
      toast('Arquivo inválido: não é um backup deste guia.', 'error');
    }
  };
  reader.readAsText(file);
}

function doPrint(mode) {

    setTimeout(() => window.print(), 50);

window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-card-mode');

/* =====================================================================
   16. FORMULÁRIOS: campos vinculados ao estado + diálogo de edição
   ===================================================================== */
/** Gera um campo ligado a um caminho do estado (salvamento automático) */
function field({ bind, label, type = 'text', rules = 'text', placeholder = '', hint = '', inputmode = '' }) {
  const id = 'f-' + bind.replace(/\./g, '-');
  const val = getPath(S, bind) ?? '';
  const attrs = `id="${id}" data-bind="${bind}" data-rules="${rules}" placeholder="${esc(placeholder)}"${inputmode ? ` inputmode="${inputmode}"` : ''}`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>
    ${type === 'textarea' ? `<textarea ${attrs}>${esc(val)}</textarea>` : `<input type="${type}" ${attrs} value="${esc(val)}" autocomplete="off">`}
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<div class="err" hidden></div></div>`;
}

function onBoundInput(el) {
  const err = validate(el.value, el.dataset.rules);
  const wrap = el.closest('.field');
  if (wrap) {
    wrap.classList.toggle('invalid', !!err);
    const e = $('.err', wrap); if (e) { e.hidden = !err; e.textContent = err || ''; }
  }
  if (err) return; // não salva valor inválido
  setPath(S, el.dataset.bind, el.value);
  if (el.dataset.bind.startsWith('info.')) updateCostTotal();
  commitDebounced();
}

/** Diálogo genérico de formulário com validação */
let formCtx = null;
function openForm({ title, fields, onSave }) {
  const dlg = $('#formDialog');
  formCtx = { fields, onSave };
  dlg.innerHTML = `<form method="dialog" novalidate>
    <h3>${esc(title)}</h3>
    ${fields.map(f => `<div class="field"><label for="dlg-${f.key}">${esc(f.label)}${(f.rules || '').includes('required') ? ' *' : ''}</label>
      ${f.type === 'textarea' ? `<textarea id="dlg-${f.key}" name="${f.key}" placeholder="${esc(f.placeholder || '')}">${esc(f.value)}</textarea>`
        : `<input id="dlg-${f.key}" name="${f.key}" type="${f.type || 'text'}" value="${esc(f.value)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">`}
      <div class="err" hidden></div></div>`).join('')}
    <div class="dlg-actions"><button type="button" class="btn ghost" data-action="dlg-cancel">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
  </form>`;
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  // foca o primeiro campo apenas se o usuário ainda não estiver em outro
  setTimeout(() => { if (!dlg.contains(document.activeElement) || document.activeElement.tagName === 'BUTTON') $('input,textarea', dlg)?.focus(); }, 30);
}
function closeForm() { const d = $('#formDialog'); if (d.open) d.close?.(); d.removeAttribute('open'); formCtx = null; }

$('#formDialog').addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (!formCtx) return;
  const form = ev.target, values = {};
  let ok = true;
  formCtx.fields.forEach(f => {
    const el = form.elements[f.key];
    const v = el.value.trim();
    const err = validate(v, f.rules);
    const wrap = el.closest('.field');
    wrap.classList.toggle('invalid', !!err);
    const e = $('.err', wrap); e.hidden = !err; e.textContent = err || '';
    if (err) ok = false;
    values[f.key] = v;
  });
  if (!ok) return toast('Verifique os campos destacados.', 'error');
  try { const cb = formCtx.onSave; closeForm(); cb(values); }
  catch (e) { console.error(e); toast('Erro ao salvar.', 'error'); }
});

/* =====================================================================
   17. EVENTOS (delegação)
   ===================================================================== */
const ACTIONS = {
  'go': el => go(el.dataset.view),
  'set-fam': el => { S.myFam = el.dataset.fam; commit(); renderHotel(); renderChecklistView(); },
  'sos': openSOS,
  'close-sos': closeSOS,
  'leg': el => { currentLeg = el.dataset.leg; renderRoute(); },
  'edit-step': el => editStep(el.dataset.id),
  'add-plan': el => editPlan(el.dataset.day),
  'edit-plan': el => editPlan(el.dataset.day, el.dataset.id),
  'del-plan': el => {
    const day = S.plan.find(d => d.id === el.dataset.day);
    if (!day || !confirm('Excluir esta atividade?')) return;
    day.items = day.items.filter(i => i.id !== el.dataset.id); commit('Atividade excluída'); renderPasseios();
  },
  'add-contact': el => editContact(el.dataset.kind, el.dataset.fam),
  'edit-contact': el => editContact(el.dataset.kind, el.dataset.fam, el.dataset.id),
  'del-contact': el => {
    const list = contactList(el.dataset.kind, el.dataset.fam);
    const c = list?.find(x => x.id === el.dataset.id);
    if (!c || !confirm(`Excluir o contato ${c.name || 'sem nome'}?`)) return;
    list.splice(list.indexOf(c), 1); commit('Contato excluído'); renderContatos();
  },
  'rename-fam': el => {
    const f = S.families.find(x => x.id === el.dataset.fam); if (!f) return;
    openForm({ title: 'Renomear família', fields: [{ key: 'title', label: 'Nome do grupo', rules: 'required|text', value: f.title }],
      onSave: v => { f.title = v.title; commit('Nome atualizado'); renderContatos(); } });
  },
  'del-check': el => {
    const list = getChecklist(el.dataset.list); if (!list) return;
    const it = list.items.find(i => i.id === el.dataset.id);
    if (!it || !confirm(`Remover “${it.text}” da lista?`)) return;
    list.items = list.items.filter(i => i !== it); commit('Item removido'); rerenderChecklist(list.id);
  },
  'reset-checks': () => {
    if (!confirm('Desmarcar todos os itens do checklist geral?')) return;
    CL().forEach(c => c.items.forEach(i => (i.done = false))); commit('Checklist reiniciado'); renderChecklistView();
  },
  'add-expense': () => openForm({ title: 'Nova despesa', fields: [
      { key: 'desc', label: 'Descrição', rules: 'required|text', placeholder: 'Ex.: lanche na estrada' },
      { key: 'value', label: 'Valor (R$)', rules: 'required|money', placeholder: '0,00' }],
    onSave: v => { S.info.expenses.push({ id: uid(), ...v }); commit('Despesa adicionada'); renderInfo(); } }),
  'del-expense': el => { if (!confirm('Excluir esta despesa?')) return; S.info.expenses = S.info.expenses.filter(e => e.id !== el.dataset.id); commit('Despesa excluída'); renderInfo(); },
  'weather': fetchWeather,
  'seizure-start': seizureStart,
  'seizure-stop': seizureStop,
  'clear-seizure-log': () => { if (!confirm('Apagar o registro de crises?')) return; S.seizureLog = []; commit('Registro apagado'); renderSaude(); },
  'share-emergency': () => shareText('Informações de emergência', emergencyText()),
  'share-trip': () => shareText('Viagem Vale da Mantiqueira', tripText()),
  'print-all': () => doPrint('all'),
  'print-card': () => doPrint('card'),
  'export': exportBackup,
  'import': () => $('#importFile').click(),
  'reset-all': () => {
    if (!confirm('Apagar os dados DESTE APARELHO (registro de crises e cópia local)? Os dados compartilhados do grupo não são apagados. Recomenda-se exportar um backup antes.')) return;
    if (!confirm('Tem certeza? Esta ação não pode ser desfeita.')) return;
    // Não propaga o apagamento ao grupo: os dados compartilhados voltam na próxima sincronização
    S = defaultState(); Sync.rebase(true); commit('Dados apagados'); renderAll(); Sync.run();
  },
  'dlg-cancel': closeForm,
  'theme-cycle': () => Theme.cycle(),
  'theme-set': el => Theme.set(el.dataset.theme)
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]');
  if (el) {
    const fn = ACTIONS[el.dataset.action];
    if (fn) { ev.preventDefault(); try { fn(el); } catch (e) { console.error(e); toast('Algo deu errado. Tente novamente.', 'error'); } }
    return;
  }
  // Aviso de conexão para links externos
  const net = ev.target.closest('a.needs-net');
  if (net && !navigator.onLine) toast('Sem conexão: esta função pode não funcionar sem internet.', 'error');
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  try {
    if (el.dataset.change === 'check') {
      const list = getChecklist(el.dataset.list); const it = list?.items.find(i => i.id === el.dataset.id);
      if (!it) return;
      it.done = el.checked; commit(); rerenderChecklist(list.id);
      if (list.items.length && list.items.every(i => i.done)) toast(`${list.title}: tudo pronto! ✅`, 'ok');
    } else if (el.dataset.change === 'plan') {
      const it = S.plan.find(d => d.id === el.dataset.day)?.items.find(i => i.id === el.dataset.id);
      if (!it) return;
      it.done = el.checked; commit(el.checked ? 'Marcado como realizado' : ''); renderPasseios();
    } else if (el.dataset.change === 'hosp-confirm') {
      S.hospitals[el.dataset.id].confirmed = el.checked; commit(el.checked ? 'Hospital marcado como confirmado' : 'Confirmação removida');
      renderSaude();
    } else if (el.id === 'importFile') {
      importBackup(el.files[0]); el.value = '';
    }
  } catch (e) { console.error(e); toast('Não foi possível salvar a alteração.', 'error'); }
});

document.addEventListener('toggle', (ev) => { const f = ev.target.dataset?.res; if (f) resOpen[f] = ev.target.open; }, true);
document.addEventListener('input', (ev) => { if (ev.target.matches('[data-bind]')) onBoundInput(ev.target); });
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-form="add-check"]');
  if (!f) return;
  ev.preventDefault();
  const text = f.elements.text.value.trim();
  if (!text) return toast('Digite o nome do item.', 'error');
  if (text.length > 120) return toast('Máximo de 120 caracteres.', 'error');
  const list = getChecklist(f.dataset.list);
  list.items.push({ id: uid(), text, done: false });
  commit('Item adicionado'); rerenderChecklist(list.id);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('#sosOverlay').hidden) closeSOS(); });
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);

/* =====================================================================
   18. INICIALIZAÇÃO
   ===================================================================== */
/** Atualiza partes derivadas após salvar (sem tirar o foco dos campos) */
function renderDerived() {
  renderPendencies();
  const slot = $('#emCardSlot'); if (slot) slot.innerHTML = emergencyCardHtml();
}
function renderAll() {
  renderHome(); renderRoute(); renderSaude(); renderContatos(); renderMais();
  renderHotel(); renderPasseios(); renderChecklistView(); renderInfo();
  Theme.apply();
}

(function init() {
  try {
    renderAll();
    updateNet();
    if (!Store.available) $('#storageWarning').hidden = false;
    if (S.seizure.running) startSeizureTick();
    setInterval(updateCountdown, 30000);
    go(location.hash.slice(1) || 'inicio', { push: false });
    Sync.init();
    // Service worker: guarda o guia no aparelho para abrir sem internet
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<div class="banner warn">Erro ao carregar o guia. Tente recarregar a página.</div>');
  }
})();
</script>
